# Unified BoxMOT tracker configuration for the Ultralytics runtime.
# The Python registry owns the complete defaults and allowed parameter list for
# every BoxMOT algorithm. This device file configures only the selected one.
algorithm: bytetrack

# Shared BoxMOT BaseTracker values used by the selected algorithm.
common:
  det_thresh: 0.3
  max_age: 30
  max_obs: 50
  min_hits: 3
  iou_threshold: 0.3
  per_class: false
  asso_func: iou

# Complete ByteTrack-specific values. To select another algorithm, replace
# `algorithm` and this block with that algorithm's supported parameters.
params:
  min_conf: 0.2
  track_thresh: 0.5
  match_thresh: 0.8
  track_buffer: 75
  frame_rate: 12

# Add this block only for a selected algorithm that uses ReID:
# reid:
#   backend: pytorch              # pytorch | tensorrt
#   device: auto                  # auto | cpu | cuda | mps
#   half: true                    # effective only on CUDA for pytorch
#   weights: "osnet_x0_25_msmt17.pt"


# ── Complete algorithm reference ─────────────────────────────────────────────
# The blocks below are templates, intentionally commented so this remains a
# valid one-algorithm configuration. To switch, replace the active `algorithm`
# and `params` above with exactly one matching template. Add `reid` when noted.

# BoT-SORT (ReID optional through with_reid)
# algorithm: botsort
# params:
#   track_high_thresh: 0.5
#   track_low_thresh: 0.1
#   new_track_thresh: 0.6
#   track_buffer: 30
#   match_thresh: 0.8
#   proximity_thresh: 0.5
#   appearance_thresh: 0.25
#   use_cmc: false
#   cmc_method: ecc
#   frame_rate: 30
#   fuse_first_associate: false
#   with_reid: true
#   second_match_thresh: 0.5
#   unconfirmed_match_thresh: 0.7
#   unconfirmed_emb_scale: 2.0
#   removed_stracks_buffer: 100

# OCSORT (no ReID)
# algorithm: ocsort
# params:
#   min_conf: 0.1
#   delta_t: 3
#   inertia: 0.2
#   use_byte: false
#   Q_xy_scaling: 0.01
#   Q_s_scaling: 0.0001

# StrongSORT (ReID required)
# algorithm: strongsort
# params:
#   min_conf: 0.1
#   max_cos_dist: 0.2
#   max_iou_dist: 0.7
#   n_init: 3
#   nn_budget: 100
#   mc_lambda: 0.98
#   ema_alpha: 0.9

# DeepOCSORT (ReID used unless embedding_off is true)
# algorithm: deepocsort
# params:
#   delta_t: 3
#   inertia: 0.2
#   w_association_emb: 0.5
#   alpha_fixed_emb: 0.95
#   aw_param: 0.5
#   embedding_off: false
#   cmc_off: false
#   aw_off: false
#   Q_xy_scaling: 0.01
#   Q_s_scaling: 0.0001

# SFSORT (no ReID; high_th supplies its detection threshold)
# algorithm: sfsort
# params:
#   high_th: 0.6
#   match_th_first: 0.67
#   new_track_th: 0.7
#   low_th: 0.1
#   match_th_second: 0.3
#   dynamic_tuning: false
#   cth: 0.5
#   high_th_m: 0.0
#   new_track_th_m: 0.0
#   match_th_first_m: 0.0
#   obb_theta_damping: 0.8
#   marginal_timeout: 0
#   central_timeout: 0
#   frame_width: null
#   frame_height: null
#   horizontal_margin: null
#   vertical_margin: null

# HybridSORT (ReID controlled by with_reid/with_longterm_reid)
# algorithm: hybridsort
# params:
#   cmc_method: ecc
#   with_reid: true
#   low_thresh: 0.1
#   delta_t: 3
#   inertia: 0.05
#   use_byte: true
#   longterm_bank_length: 30
#   alpha: 0.9
#   adapfs: false
#   track_thresh: 0.5
#   EG_weight_high_score: 4.6
#   EG_weight_low_score: 1.3
#   TCM_first_step: true
#   TCM_byte_step: true
#   TCM_byte_step_weight: 1.0
#   high_score_matching_thresh: 0.7
#   with_longterm_reid: true
#   longterm_reid_weight: 0.0
#   with_longterm_reid_correction: true
#   longterm_reid_correction_thresh: 0.4
#   longterm_reid_correction_thresh_low: 0.4
#   dataset: ""

